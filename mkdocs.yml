site_name: "Документация Tellem"
site_url: "https://orgtellem.github.io"
site_description: "Документация Tellem: клиентское приложение магазина и CRM — настройка каталога, оплаты, доставки, бонусной системы и Telegram-бота."

nav:
  - О продукте: index.md
  - Начало работы:
      - Подключение и первый вход: getting-started/registration.md
      - Чек-лист запуска магазина: modules/crm/getting-started.md
  - CRM:
      - Заказы: modules/crm/orders.md
      - Клиенты: modules/crm/clients.md
      - Каталог:
          - Магазины: modules/crm/stores-and-delivery.md
          - Категории и товары: modules/crm/products-and-categories.md
          - Оформление: modules/crm/main-page.md
          - Наличие и снятие с продажи: modules/crm/inventory.md
          - Импорт: modules/crm/catalog-import.md
      - Главная и аналитика: modules/crm/analytics.md
      - Маркетинг:
          - Рассылки: modules/crm/mass-mailings.md
          - Акции и промокоды: modules/crm/promo-codes.md
          - Бонусы: modules/crm/bonus-system.md
          - Метки: modules/crm/utm-marks.md
      - Настройки:
          - Основные, Поддержка, PWA: modules/crm/general-settings.md
          - Уведомления: modules/crm/crm-notifications.md
          - Оплата: modules/crm/payment-providers.md
          - Доставка: modules/crm/delivery.md
          - Поля Заказа: modules/crm/custom-fields.md
      - Интеграции:
          - AI и пользовательские: modules/crm/integrations.md
          - Telegram: getting-started/bot-setup.md
          - iiko: modules/crm/iiko.md
  - Клиентское приложение:
      - Витрина и корзина: modules/app/ui-and-pages.md
      - Оформление и заказы: modules/app/checkout.md
      - Аккаунт, установка и уведомления: modules/app/account.md
  - Правовые документы:
      - Все документы: legal/index.md
      - Политика обработки персональных данных: legal/personal-data-policy/index.md
      - Политика конфиденциальности: legal/privacy-policy/index.md
      - Согласие покупателя: legal/consent/index.md
      - Согласие пользователя личного кабинета: legal/account-consent/index.md

# Архивные редакции правовых документов (legal/<doc>/<дата>.md) и EN-версии (legal/en/) доступны по ссылкам, но не в меню.
not_in_nav: |
  /legal/**/????-??-??.md
  /legal/en/

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
  font:
    text: Montserrat
    code: Roboto Mono
  favicon: media/favicon.svg
  logo: media/logo.svg

plugins:
  - search:
      lang: ru
  # Точка расширения под мультиязычность: при появлении второго языка
  # добавить locale в languages и файлы вида page.en.md рядом с исходными.
  - i18n:
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
  - redirects:
      redirect_maps:
        # Страница «Создание сетки каталога» объединена с оформлением главного экрана
        modules/crm/catalog-grid.md: modules/crm/main-page.md
        # Раздел переименован: продукт больше не привязан к Telegram
        modules/mini-app/ui-and-pages.md: modules/app/ui-and-pages.md
        modules/mini-app/checkout.md: modules/app/checkout.md
        # Страницы слиты при перестройке документации (2026-10)
        useful-links.md: index.md
        modules/crm/fast-product-disable.md: modules/crm/inventory.md
        modules/crm/ozon-delivery.md: modules/crm/delivery.md
        modules/crm/new-payment-method.md: modules/crm/payment-providers.md
        modules/crm/sales.md: modules/crm/promo-codes.md
        modules/crm/pwa-and-support.md: modules/crm/general-settings.md
        modules/app/install-and-notifications.md: modules/app/account.md
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true
  # Social cards (превью при шаринге ссылок, в т.ч. в Telegram).
  # Локально выключены (нужны imaging-библиотеки); в CI включаются через env.
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/extra.css

extra_javascript:
  - js/accessibility.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/tellem_support
      name: Поддержка в Telegram
    - icon: fontawesome/brands/vk
      link: https://vk.link/tellem_it
      name: Tellem ВКонтакте
