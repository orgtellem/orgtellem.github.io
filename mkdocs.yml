site_name: "Tellem Documentation"
site_url: "https://orgtellem.github.io"
site_description: "Документация Tellem: магазин в Telegram Mini App и CRM — настройка бота, каталога, оплаты, доставки и бонусной системы."

nav:
  - О продукте: index.md
  - С чего начать?:
      - Подключение и доступ к CRM: getting-started/registration.md
      - Настройка Телеграм-бота: getting-started/bot-setup.md
  - CRM-система:
      - Начало использования: modules/crm/getting-started.md
      - Создание сетки каталога: modules/crm/catalog-grid.md
      - Оформление главного экрана Телеграм-магазина: modules/crm/main-page.md
      - Настройка способов оплаты: modules/crm/new-payment-method.md
      - Работа с пригласительными ссылками (UTM-метками): modules/crm/utm-marks.md
      - Активация бонусной системы для клиентов: modules/crm/bonus-system.md
      - Сценарии использования:
          - Быстрый вывод товара из продажи: modules/crm/fast-product-disable.md
          - Настройка уведомлений сотрудникам: modules/crm/crm-notifications.md
  - Телеграм-магазин:
      - Внешний вид и основные страницы: modules/mini-app/ui-and-pages.md
      - Оформление и оплата заказа: modules/mini-app/checkout.md
  - Полезные ссылки: useful-links.md

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  font:
    text: Montserrat
    code: Roboto Mono
  favicon: media/logo.svg
  logo: media/logo.svg
  icon:
    logo: logo

plugins:
  - search:
      lang: ru
  # Точка расширения под мультиязычность: при появлении второго языка
  # добавить locale в languages и файлы вида page.en.md рядом с исходными.
  - i18n:
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
  - glightbox
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
