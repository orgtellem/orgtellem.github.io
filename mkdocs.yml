site_name: "Документация Tellem"
site_url: "https://orgtellem.github.io"
site_description: "Документация Tellem: клиентское приложение магазина и CRM — настройка каталога, оплаты, доставки, бонусной системы и Telegram-бота."

nav:
  - О продукте: index.md
  - С чего начать:
      - Подключение и доступ к CRM: getting-started/registration.md
      - Первый день в CRM: modules/crm/getting-started.md
      - Подключение Telegram-бота: getting-started/bot-setup.md
  - Работа в CRM:
      - Каталог:
          - Магазины и способы получения: modules/crm/stores-and-delivery.md
          - Товары и категории: modules/crm/products-and-categories.md
          - Импорт каталога: modules/crm/catalog-import.md
          - Наличие и склады: modules/crm/inventory.md
          - Оформление главного экрана: modules/crm/main-page.md
          - Быстрый вывод товара из продажи: modules/crm/fast-product-disable.md
      - Заказы и клиенты:
          - Работа с заказами: modules/crm/orders.md
          - Клиенты: modules/crm/clients.md
          - Уведомления сотрудникам: modules/crm/crm-notifications.md
      - Оплата:
          - Настройка способов оплаты: modules/crm/new-payment-method.md
          - Платёжные провайдеры: modules/crm/payment-providers.md
      - Маркетинг:
          - Акции: modules/crm/sales.md
          - Промокоды: modules/crm/promo-codes.md
          - Рассылки клиентам: modules/crm/mass-mailings.md
          - Бонусная система: modules/crm/bonus-system.md
          - Пригласительные ссылки (UTM-метки): modules/crm/utm-marks.md
      - Аналитика и отчёты: modules/crm/analytics.md
  - Настройки и интеграции:
      - Основные настройки: modules/crm/general-settings.md
      - Поля заказа и адреса: modules/crm/custom-fields.md
      - PWA и контакты поддержки: modules/crm/pwa-and-support.md
      - Интеграции: modules/crm/integrations.md
      - Айко: modules/crm/iiko.md
  - Клиентское приложение:
      - Внешний вид и основные страницы: modules/app/ui-and-pages.md
      - Аккаунт покупателя: modules/app/account.md
      - Оформление и оплата заказа: modules/app/checkout.md
      - Установка и push-уведомления: modules/app/install-and-notifications.md
  - Полезные ссылки: useful-links.md

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
  font:
    text: Montserrat
    code: Roboto Mono
  favicon: media/favicon.svg
  logo: media/logo.svg

plugins:
  - search:
      lang: ru
  # Точка расширения под мультиязычность: при появлении второго языка
  # добавить locale в languages и файлы вида page.en.md рядом с исходными.
  - i18n:
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
  - redirects:
      redirect_maps:
        # Страница «Создание сетки каталога» объединена с оформлением главного экрана
        modules/crm/catalog-grid.md: modules/crm/main-page.md
        # Раздел переименован: продукт больше не привязан к Telegram
        modules/mini-app/ui-and-pages.md: modules/app/ui-and-pages.md
        modules/mini-app/checkout.md: modules/app/checkout.md
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true
  # Social cards (превью при шаринге ссылок, в т.ч. в Telegram).
  # Локально выключены (нужны imaging-библиотеки); в CI включаются через env.
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/extra.css

extra_javascript:
  - js/accessibility.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/tellem_support
      name: Поддержка в Telegram
    - icon: fontawesome/brands/vk
      link: https://vk.link/tellem_it
      name: Tellem ВКонтакте
