name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history: git-revision-date-localized needs real page dates
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install social-cards system libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install MkDocs and plugins
        run: pip install -r requirements.txt

      - name: Check Russian and English page pairs
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = set(Path("docs").rglob("*.md"))
          missing = []
          for page in sorted(pages):
              name = page.name.removesuffix(".en.md") + ".md" if page.name.endswith(".en.md") else page.stem + ".en.md"
              counterpart = page.with_name(name)
              if counterpart not in pages:
                  missing.append(str(counterpart))
          assert not missing, "Missing translation counterparts:\n" + "\n".join(missing)
          print(f"Checked {len(pages) // 2} Russian/English page pairs")
          PY

      - name: Build MkDocs site
        run: mkdocs build --strict
        env:
          ENABLE_SOCIAL_CARDS: true
          # Material 9.x is pinned; hide upstream MkDocs 2.0 migration notices.
          NO_MKDOCS_2_WARNING: true
          DISABLE_MKDOCS_2_WARNING: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
